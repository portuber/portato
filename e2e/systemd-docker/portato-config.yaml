defaults:
  identity: /home/appuser/.ssh/id_ed25519
  known_hosts: /home/appuser/.ssh/known_hosts
  accept_new_hosts: true
tubers:
  - name: echo
    type: local
    local: "18080"
    remote: "127.0.0.1:28080"
    ssh: "appuser@127.0.0.1:22"
    enabled: false
  # ProxyJump (Phase 43): the target sshd (:22) is reached THROUGH the bastion
  # sshd (:2222). Both authorize the same appuser key (the shared-identity
  # model). The forward lands on the same echo backend to prove end-to-end
  # traffic through the two-hop chain.
  - name: echo-via-bastion
    type: local
    local: "19090"
    remote: "127.0.0.1:28080"
    ssh: "appuser@127.0.0.1:22"
    jump: "appuser@127.0.0.1:2222"
    enabled: false
  # ~/.ssh/config resolution (Phase 44): `ssh:` is a Host alias from
  # ~/.ssh/config (target-alias → 127.0.0.1:22, ProxyJump appuser@127.0.0.1:2222).
  # No `jump:` here — the chain comes from the alias, dialed by Phase 43. Same
  # two sshd + echo backend, proving the config-layer resolution plugs into the
  # real dial path end to end.
  - name: echo-via-alias
    type: local
    local: "19091"
    remote: "127.0.0.1:28080"
    ssh: "target-alias"
    enabled: false